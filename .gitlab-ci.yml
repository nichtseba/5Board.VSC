stages:
  - build
  - lint
  - package
  - deploy

.pnpm:
  image: node:24.14.1
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest-11 --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

build:
  extends: .pnpm
  stage: build
  script:
    - pnpm install # install dependencies
    - pnpm run build
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: 30 days
    paths:
      - 'extension/dist'
      - 'webview/dist'

package:
  rules:
    - if: '$CI_COMMIT_TAG'
  extends: .pnpm
  stage: package
  dependencies:
    - build
  script:
    - pnpm install
    - pnpm run package
  artifacts:
    untracked: false
    when: on_success
    access: all
    paths:
      - 'extension/5board-vsc-*.vsix'
  # Cant Actually do that since our runner is out of date and doesn't support the release keyword:
  # https://projectbase.medien.hs-duesseldorf.de/help/user/project/releases/_index.md#gitlab-cli-version-requirement
  # release:
  #   name: 'Release $CI_COMMIT_TAG'
  #   tag_name: '$CI_COMMIT_TAG'
  #   description: 'Release of version $CI_COMMIT_TAG'
  #   assets:
  #     - extension/5board-vsc-*.vsix

lint:
  stage: lint
  extends: .pnpm
  allow_failure: true
  script:
    - pnpm install
    - pnpm run lint --max-warnings=0

# Uploads the live server (folder `server/`) to the university web hosting (httpdocs/app.js).
# The login data HOST, USER and PASSWORD are CI/CD variables of the project.
# On main it runs by itself when something in `server/` changed. On every other branch there is
# a manual play button, so the upload can be tested before merging.
deploy_server:
  stage: deploy
  image: node:24.14.1-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - server/**/*
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache lftp
  script:
    - |
      if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASSWORD" ]; then
        echo "HOST, USER or PASSWORD is empty. If the variables exist, they are probably marked as protected and only work on main."
        exit 1
      fi
    - cd server
    - npm install
    - npm run build
    # mirror -R: upload, -e: delete files on the server that are not in ./build, -n: only newer files
    - lftp -c "set ftp:ssl-force true; open -u $USER,$PASSWORD $HOST; mirror -Renv ./build ./httpdocs"
