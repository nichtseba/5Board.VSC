stages:
  - build
  - lint
  - package
  - deploy

.pnpm:
  image: node:24.14.1
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest-11 --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

build:
  extends: .pnpm
  stage: build
  script:
    - pnpm install # install dependencies
    - pnpm run build
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: 30 days
    paths:
      - 'extension/dist'
      - 'webview/dist'
      - 'build/' # save build-folder for app.js, which is needed for the package step

package:
  rules:
    - if: '$CI_COMMIT_TAG'
  extends: .pnpm
  stage: package
  dependencies:
    - build
  script:
    - pnpm install
    - pnpm run package
  artifacts:
    untracked: false
    when: on_success
    access: all
    paths:
      - 'extension/5board-vsc-*.vsix'
  # Cant Actually do that since our runner is out of date and doesn't support the release keyword:
  # https://projectbase.medien.hs-duesseldorf.de/help/user/project/releases/_index.md#gitlab-cli-version-requirement
  # release:
  #   name: 'Release $CI_COMMIT_TAG'
  #   tag_name: '$CI_COMMIT_TAG'
  #   description: 'Release of version $CI_COMMIT_TAG'
  #   assets:
  #     - extension/5board-vsc-*.vsix

lint:
  stage: lint
  extends: .pnpm
  allow_failure: true
  script:
    - pnpm install
    - pnpm run lint --max-warnings=0

# New stage-deploy to the university server
stage_deploy:
  image: node:24.14.1
  stage: deploy
  dependencies:
    - build
  before_script:
    - apt-get update && apt-get install -y lftp
  script:
    - lftp -c "set ftp:ssl-force true; open -u $USER,$PASSWORD $HOST; mirror -Renv ./build ./httpdocs"
  only:
    - main
