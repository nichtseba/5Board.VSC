stages:
  - build
  - package

.pnpm:
  image: node:24.14.1
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest-11 --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

build:
  extends: .pnpm
  stage: build
  script:
    - pnpm install # install dependencies
    - pnpm run build
  artifacts:
    untracked: false
    when: on_success
    access: all
    expire_in: 30 days
    paths:
      - "extension/dist"

package:
  extends: .pnpm
  stage: package
  before_script:
    cd extension
  script:
    pwd
    