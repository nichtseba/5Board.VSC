<!DOCTYPE html>
<html lang="de">
  <head>
    <title>5Board Webview Test Editor</title>
  </head>
  <body>

    <h1>5Board Test-Seite</h1>
    <p>Dies ist die Test-Seite des 5Board Webview. Für Links zu den anderen Seiten, klicken Sie auf die entsprechenden Buttons.</p>
    <button onclick="navigate('index.html')">Zurück</button>
  </body>
  <script>
    const vscode = acquireVsCodeApi();

    function navigate(page) {
      vscode.postMessage({
        command: 'navigate',
        page
      });
    }
  </script>
</html>
